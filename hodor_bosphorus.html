<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حضور البسفور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F4;
    --surface:#FFFFFF;
    --ink:#3A2E35;
    --muted:#8B7A80;
    --line:#EAE0DD;
    --rose:#9B4358;
    --rose-dark:#7A2F41;
    --rose-tint:#F3E3E6;
    --gold:#C08A3E;
    --gold-tint:#F6ECD9;
    --green:#4C7A5E;
    --green-tint:#E4EEE8;
    --red:#B0413E;
    --red-tint:#F7E4E3;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}
  header.top{
    padding:22px 20px 18px;
    background:linear-gradient(160deg,var(--rose) 0%, var(--rose-dark) 100%);
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:10px;
    background-image:repeating-linear-gradient(90deg,transparent,transparent 10px,rgba(255,255,255,.35) 10px,rgba(255,255,255,.35) 14px);
    opacity:.6;
  }
  header.top .brand{font-family:'Cairo',sans-serif;font-weight:800;font-size:22px;letter-spacing:.3px;}
  header.top .sub{font-size:13px;opacity:.85;margin-top:2px;}
  .stitch{
    height:1px;
    margin:18px 0;
    background-image:repeating-linear-gradient(90deg,var(--line),var(--line) 8px,transparent 8px,transparent 14px);
  }
  main{flex:1;padding:20px;padding-bottom:100px;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .card h3{margin:0 0 12px;font-size:16px;color:var(--rose-dark);}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:15px;border-radius:12px;border:none;
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:16px;
    cursor:pointer;transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--rose);color:#fff;}
  .btn-primary:hover{background:var(--rose-dark);}
  .btn-outline{background:transparent;color:var(--rose);border:1.5px solid var(--rose);}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-sm{padding:9px 14px;font-size:13px;width:auto;border-radius:9px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  input,select{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-family:'Tajawal',sans-serif;font-size:15px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus{outline:none;border-color:var(--rose);}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;}
  .pill-green{background:var(--green-tint);color:var(--green);}
  .pill-red{background:var(--red-tint);color:var(--red);}
  .pill-gold{background:var(--gold-tint);color:var(--gold);}
  .pill-muted{background:var(--line);color:var(--muted);}
  .hidden{display:none !important;}
  /* PIN pad */
  .pin-dots{display:flex;justify-content:center;gap:14px;margin:26px 0;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--rose);background:transparent;transition:background .15s;}
  .pin-dot.filled{background:var(--rose);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto;}
  .pin-key{
    aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:#fff;
    font-family:'Cairo',sans-serif;font-size:22px;font-weight:700;color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .pin-key:active{background:var(--rose-tint);}
  .pin-key.wide{font-size:14px;color:var(--muted);border:none;background:none;font-family:'Tajawal',sans-serif;}
  .center{text-align:center;}
  .muted{color:var(--muted);font-size:13px;}
  .big-num{font-family:'Cairo',sans-serif;font-weight:800;font-size:30px;}
  .employee-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);}
  .employee-row:last-child{border-bottom:none;}
  .avatar{
    width:40px;height:40px;border-radius:50%;background:var(--rose-tint);color:var(--rose-dark);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Cairo',sans-serif;flex-shrink:0;
  }
  .name-block{display:flex;align-items:center;gap:10px;}
  .bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50;
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 2px;background:none;border:none;cursor:pointer;color:var(--muted);
    font-family:'Tajawal',sans-serif;font-size:10.5px;font-weight:700;
  }
  .nav-btn.active{color:var(--rose);}
  .nav-icon{font-size:19px;line-height:1;}
  .modal-bg{
    position:fixed;inset:0;background:rgba(58,46,53,.5);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal{
    background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  }
  .modal-handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:12px;}
  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;
    font-size:14px;font-weight:600;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2);
    opacity:0;transition:opacity .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .icon-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:6px;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .chip-check{
    display:inline-flex;align-items:center;justify-content:center;
    padding:10px 4px;border:1.5px solid var(--line);border-radius:10px;font-size:12px;font-weight:700;
    cursor:pointer;color:var(--muted);
  }
  .chip-check.on{background:var(--rose);border-color:var(--rose);color:#fff;}
  .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .link-btn{background:none;border:none;color:var(--rose);font-weight:700;font-size:13px;cursor:pointer;font-family:'Tajawal',sans-serif;}
  .spinner{
    width:34px;height:34px;border:3px solid var(--rose-tint);border-top-color:var(--rose);
    border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===================== SCREEN: PIN LOGIN ===================== -->
  <div id="screen-login">
    <header class="top">
      <div class="brand">حضور البسفور</div>
      <div class="sub">أدخل رمزك الخاص لتسجيل الحضور</div>
    </header>
    <main>
      <div class="pin-dots" id="pinDots">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>

      <div class="pin-pad" id="pinPad">

  <!-- ===================== SCREEN: EMPLOYEE CHECK-IN ===================== -->
  <div id="screen-employee" class="hidden">

    <main>

        <div id="empStatusPill"></div>
        <div class="stitch"></div>
        <div id="gpsStatus" class="muted" style="margin-bottom:14px;">جارِ تحديد الموقع...</div>
        <button class="btn btn-primary" id="btnCheckAction" disabled>...</button>
      </div>
      <div class="card">
        <h3>سجل اليوم</h3>
        <div id="todayLog" class="muted">لا يوجد تسجيل بعد اليوم</div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <h3 style="margin:0;">وضعي هذا الأسبوع</h3>

  <!-- ===================== SCREEN: ADMIN ===================== -->

    <main>

          <div id="empList"><div class="spinner"></div></div>

      </div>

      <!-- TAB: stores -->
      <div id="tab-stores" class="tab-panel hidden">
        <button class="btn btn-primary" id="btnAddStore" style="margin-bottom:14px;">+ إضافة فرع</button>

      <!-- TAB: deductions -->
      <div id="tab-deductions" class="tab-panel hidden">

        <div class="card">
          <div id="dedList"><div class="spinner"></div></div>

      </div>

      <!-- TAB: payroll -->
      <div id="tab-payroll" class="tab-panel hidden">

          <div id="payrollList"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- TAB: statements -->
      <div id="tab-statements" class="tab-panel hidden">
        <div class="card">
          <h3>الكشف</h3>
          <div class="field"><label>الموظف</label><select id="stmtEmp"><option value="all">كل الموظفين</option></select></div>
          <div class="field">
            <label>الفترة</label>

    </main>

    <nav class="bottom-nav" id="adminNav">

      <button class="nav-btn" data-tab="employees"><span class="nav-icon">👥</span>الموظفين</button>

      <button class="nav-btn" data-tab="payroll"><span class="nav-icon">💰</span>الرواتب</button>
      <button class="nav-btn" data-tab="statements"><span class="nav-icon">📄</span>كشوفات</button>

    <button class="link-btn" id="btnAdminLogout" style="position:fixed;top:16px;left:16px;color:#fff;z-index:60;">خروج</button>

  <div class="toast" id="toast"></div>

<!-- ===================== MODAL ROOT ===================== -->
<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDocs, getDoc, addDoc, updateDoc, deleteDoc,
  setDoc, query, where, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAsllnjBZO4K9MyJNiTFoQJSfKtycQHMtU",
  authDomain: "bosphorus-76067.firebaseapp.com",
  projectId: "bosphorus-76067",
  storageBucket: "bosphorus-76067.firebasestorage.app",
  messagingSenderId: "678947739557",
  appId: "1:678947739557:web:f3d70cfc44d862ddf53a4c",
  measurementId: "G-87J6WZ2YJ7"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Collection names — kept separate from the main sales system collections.
const COL_EMP = "hr_employees";
const COL_STORE = "hr_stores";
const COL_ATT = "hr_attendance";
const COL_DED = "hr_deductions";
const COL_PAY = "hr_payments";
const COL_CFG = "hr_config";

const DAY_NAMES = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const DAY_SHORT = ["ح","ن","ث","ر","خ","ج","س"];

let ADMIN_PIN = "9999"; // default, overridable via hr_config/settings.adminPin
let employeesCache = [];
let storesCache = [];
let currentEmployee = null;
let pinBuffer = "";
let weekStart = getSaturdayOfCurrentWeek(new Date());

function $(sel){ return document.querySelector(sel); }
function $all(sel){ return Array.from(document.querySelectorAll(sel)); }
function showToast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
function pad2(n){ return String(n).padStart(2,"0"); }
function dateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function timeStr(d){ return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function minutesFromHHMM(hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(":").map(Number);
  return h*60+m;
}
function getSaturdayOfCurrentWeek(d){
  const date = new Date(d);
  date.setHours(0,0,0,0);
  const day = date.getDay(); // 0=Sun..6=Sat
  const diff = (day + 1) % 7; // days since last Saturday
  date.setDate(date.getDate() - diff);
  return date;
}
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtDateShort(d){ return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`; }
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000;
  const toRad = x=>x*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function money(n){ return Math.round(n).toLocaleString("en-US"); }
function deductionForMinutes(tiers, minutes){
  if(!tiers || tiers.length===0 || minutes<=0) return 0;
  const sorted = [...tiers].sort((a,b)=>a.minutes-b.minutes);
  let applied = 0;
  for(const t of sorted){
    if(minutes >= t.minutes) applied = t.amount;
  }
  return applied;
}

/* ---------------- INIT / CONFIG ---------------- */
async function loadConfig(){
  try{
    const ref = doc(db, COL_CFG, "settings");
    const snap = await getDoc(ref);
    if(snap.exists() && snap.data().adminPin){
      ADMIN_PIN = snap.data().adminPin;
    } else {
      await setDoc(ref, { adminPin: ADMIN_PIN }, { merge:true });
    }
  }catch(e){ console.error("config load failed", e); }
}

async function loadEmployees(){
  const snap = await getDocs(collection(db, COL_EMP));
  employeesCache = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  return employeesCache;
}
async function loadStores(){
  const snap = await getDocs(collection(db, COL_STORE));
  storesCache = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  return storesCache;
}

/* ---------------- LOGIN ---------------- */
function resetPin(){
  pinBuffer = "";
  renderPinDots();
  $("#loginMsg").textContent = "";
}
function renderPinDots(){
  const dots = $all("#pinDots .pin-dot");
  dots.forEach((d,i)=> d.classList.toggle("filled", i < pinBuffer.length));
}
async function handlePinDigit(k){
  if(pinBuffer.length >= 4) return;
  pinBuffer += k;
  renderPinDots();
  if(pinBuffer.length === 4){
    await attemptLogin(pinBuffer);
  }
}
async function attemptLogin(pin){
  $("#loginMsg").textContent = "جارِ التحقق...";
  await loadEmployees();
  if(pin === ADMIN_PIN){
    resetPin();
    enterAdmin();
    return;
  }
  const emp = employeesCache.find(e => e.code === pin && e.active !== false);
  if(emp){
    currentEmployee = emp;
    resetPin();
    await enterEmployee(emp);
  } else {
    $("#loginMsg").textContent = "الرمز غير صحيح";
    setTimeout(resetPin, 700);
  }
}

/* ---------------- EMPLOYEE SCREEN ---------------- */
let empClockInterval = null;
async function enterEmployee(emp){
  $("#screen-login").classList.add("hidden");
  $("#screen-admin").classList.add("hidden");
  $("#screen-employee").classList.remove("hidden");
  $("#empName").textContent = emp.name;
  const store = storesCache.find(s=>s.id===emp.storeId);
  $("#empSub").textContent = store ? `فرع ${store.name}` : "بدون فرع محدد";

  updateClock();
  if(empClockInterval) clearInterval(empClockInterval);
  empClockInterval = setInterval(updateClock, 1000*20);

  await refreshEmployeeStatus();
  await renderEmployeeWeekSummary();
  locateAndPrepare();
}

async function renderEmployeeWeekSummary(){
  const wrap = $("#empWeekSummary");
  wrap.innerHTML = `<div class="spinner"></div>`;
  const balance = await computeEmployeeBalance(currentEmployee);
  const ws = getSaturdayOfCurrentWeek(new Date());
  $("#empWeekRange").textContent = `${fmtDateShort(ws)} — ${fmtDateShort(addDays(ws,6))}`;
  const b = await computeWeeklyBreakdown(currentEmployee, ws);
  const dayRows = b.dayDetails.map(d=>{
    if(d.type==="absent") return `<div class="employee-row"><span>${d.date} — غياب</span><span class="pill pill-red">${money(d.amount)} د.ع</span></div>`;
    const parts=[];
    if(d.lateMin>0) parts.push(`تأخير ${d.lateMin}د`);
    if(d.earlyMin>0) parts.push(`انصراف مبكر ${d.earlyMin}د`);
    return `<div class="employee-row"><span>${d.date} — ${parts.join("، ")}</span><span class="pill pill-red">${money(d.amount)} د.ع</span></div>`;
  }).join("");
  const manualRows = b.manualEntries.map(m=>`<div class="employee-row"><span>${m.date} — ${m.reason||"استقطاع"}</span><span class="pill pill-red">${money(m.amount)} د.ع</span></div>`).join("");
  wrap.innerHTML = `
    <div class="center" style="margin-bottom:10px;">
      <span class="muted" style="font-size:12px;">الرصيد المستحق لك الآن</span>
      <div class="big-num" style="font-size:26px;color:var(--green);">${money(balance.balance)} د.ع</div>
    </div>
    <div class="stitch"></div>

let lastKnownPosition = null;
function locateAndPrepare(){
  $("#gpsStatus").textContent = "جارِ تحديد الموقع...";
  $("#btnCheckAction").disabled = true;
  if(!navigator.geolocation){
    $("#gpsStatus").textContent = "الجهاز لا يدعم تحديد الموقع";
    $("#btnCheckAction").disabled = false;
    return;
  }
  navigator.geolocation.getCurrentPosition(pos=>{
    lastKnownPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    evaluateGeofence();
  }, err=>{
    $("#gpsStatus").textContent = "تعذّر الوصول للموقع — تأكد من تفعيل صلاحية الموقع";
    $("#btnCheckAction").disabled = false; // allow anyway, will record without geofence lock
  }, { enableHighAccuracy:true, timeout:12000 });
}
function evaluateGeofence(){
  const store = storesCache.find(s=>s.id===currentEmployee.storeId);
  if(!store || store.lat==null){
    $("#gpsStatus").textContent = "تم تحديد موقعك";
    $("#btnCheckAction").disabled = false;
    return;
  }
  const dist = haversine(lastKnownPosition.lat, lastKnownPosition.lng, store.lat, store.lng);
  const radius = store.radius || 150;
  if(dist <= radius){
    $("#gpsStatus").innerHTML = `<span class="pill pill-green">داخل نطاق ${store.name}</span>`;
    $("#btnCheckAction").disabled = false;
  } else {
    $("#gpsStatus").innerHTML = `<span class="pill pill-red">خارج نطاق ${store.name} (${Math.round(dist)} م)</span>`;
    $("#btnCheckAction").disabled = false; // still allow, admin can review from the log
  }
}

async function refreshEmployeeStatus(){

async function handleCheckAction(){

  const action = btn.dataset.action;

let pendingAction = null;
async function proceedWithAttendance(){
  const action = pendingAction;
  const btn = $("#btnCheckAction");
  btn.disabled = true;
  btn.textContent = "جارِ الحفظ...";
  const now = new Date();
  const today = dateStr(now);
  const ref = doc(db, COL_ATT, `${currentEmployee.id}_${today}`);

  if(action === "in"){
    let lateMinutes = 0;
    if(currentEmployee.workStart){
      const scheduled = minutesFromHHMM(currentEmployee.workStart);
      const actual = now.getHours()*60+now.getMinutes();
      lateMinutes = Math.max(0, actual - scheduled);
    }
    await setDoc(ref, {
      employeeId: currentEmployee.id,
      employeeName: currentEmployee.name,
      date: today,
      checkInTime: timeStr(now),
      checkInLoc: lastKnownPosition || null,
      faceVerified: true,
      lateMinutes,
      createdAt: serverTimestamp()
    }, { merge:true });
    showToast("تم تسجيل الحضور ✅");
  } else if(action === "out"){
    let earlyMinutes = 0;
    if(currentEmployee.workEnd){
      const scheduled = minutesFromHHMM(currentEmployee.workEnd);
      const actual = now.getHours()*60+now.getMinutes();
      earlyMinutes = Math.max(0, scheduled - actual);
    }
    await updateDoc(ref, {
      checkOutTime: timeStr(now),
      checkOutLoc: lastKnownPosition || null,
      earlyMinutes
    });
    showToast("تم تسجيل الانصراف ✅");
  }
  await refreshEmployeeStatus();
  await renderEmployeeWeekSummary();
}

/* ---------------- FACE RECOGNITION ---------------- */
let faceApiLoaded = false, faceModelsLoaded = false, faceStream = null;
function loadScriptTag(src){
  return new Promise((resolve,reject)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error("load failed"));
    document.head.appendChild(s);
  });
}
async function ensureFaceApiReady(onStatus){
  if(!faceApiLoaded){
    onStatus && onStatus("جارِ تحميل مكتبة التعرف على الوجه...");
    await loadScriptTag("https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js");
    faceApiLoaded = true;
  }
  if(!faceModelsLoaded){
    onStatus && onStatus("جارِ تحميل نموذج التعرف (أول مرة فقط)...");
    const MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
    faceModelsLoaded = true;
  }
}
function openFaceModal(mode){
  const modal = `
  <div class="modal-bg" id="faceModalBg">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3>${mode==="enroll" ? "تسجيل وجهك لأول مرة" : "تأكيد الوجه"}</h3>
      <div class="center muted" id="faceStatus" style="margin-bottom:10px;font-size:13px;">جارِ تجهيز الكاميرا...</div>
      <video id="faceVideo" autoplay playsinline muted style="width:100%;border-radius:14px;background:#000;transform:scaleX(-1);"></video>
      <button class="btn btn-primary" id="btnCaptureFace" style="margin-top:14px;" disabled>التقاط والتأكيد</button>
      <button class="link-btn" id="btnCancelFace" style="width:100%;margin-top:12px;">إلغاء</button>
    </div>
  </div>`;
  $("#modalRoot").innerHTML = modal;
  $("#btnCancelFace").addEventListener("click", closeFaceModal);
  startFaceCamera(mode);
}
function closeFaceModal(){
  if(faceStream){ faceStream.getTracks().forEach(t=>t.stop()); faceStream = null; }
  closeModal();
}
async function startFaceCamera(mode){
  const statusEl = $("#faceStatus");
  try{
    await ensureFaceApiReady(msg=>{ if(statusEl) statusEl.textContent = msg; });
    faceStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:"user" } });
    const video = $("#faceVideo");
    if(!video) return; // modal was closed while loading
    video.srcObject = faceStream;
    statusEl.textContent = "حاذِ وجهك داخل الإطار واضغط التقاط والتأكيد";
    $("#btnCaptureFace").disabled = false;
    $("#btnCaptureFace").addEventListener("click", ()=> captureFace(mode));
  }catch(e){
    console.error(e);
    if(statusEl) statusEl.textContent = "تعذّر تشغيل الكاميرا — تأكد من صلاحية الوصول للكاميرا بالمتصفح";
  }
}
async function captureFace(mode){
  const video = $("#faceVideo");
  const statusEl = $("#faceStatus");
  const btn = $("#btnCaptureFace");
  if(!video) return;
  statusEl.textContent = "جارِ التحليل...";
  btn.disabled = true;
  let detection;
  try{
    detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks().withFaceDescriptor();
  }catch(e){ console.error(e); }
  if(!detection){
    statusEl.textContent = "ما تم العثور على وجه واضح — قرّب من الكاميرا وحسّن الإضاءة وحاول ثانية";
    btn.disabled = false;
    return;
  }
  const descriptor = Array.from(detection.descriptor);
  if(mode === "enroll"){
    await updateDoc(doc(db, COL_EMP, currentEmployee.id), { faceDescriptor: descriptor });
    currentEmployee.faceDescriptor = descriptor;
    closeFaceModal();
    showToast("تم تسجيل الوجه ✅");
    proceedWithAttendance();
  } else {
    const dist = faceapi.euclideanDistance(descriptor, currentEmployee.faceDescriptor);
    if(dist < 0.5){
      closeFaceModal();
      proceedWithAttendance();
    } else {
      statusEl.textContent = "الوجه ما تطابق مع المسجّل — حاول ثانية";
      btn.disabled = false;
    }
  }
}

/* ---- Shared breakdown calc for any date range (used by balance calc, statements, employee self-view) ---- */
async function computeBreakdownForRange(emp, rangeStartDate, rangeEndDate){
  const rangeStartStr = dateStr(rangeStartDate);
  const rangeEndStr = dateStr(rangeEndDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const effectiveEnd = rangeEndDate < today ? rangeEndDate : today;

  const workDays = emp.workDays || [];
  const startMin = minutesFromHHMM(emp.workStart);
  const endMin = minutesFromHHMM(emp.workEnd);
  const dailyHours = (startMin!=null && endMin!=null) ? Math.max(0,(endMin-startMin)/60) : 0;
  const scheduledDaysInWeekBase = 7; // used only to derive an hourly rate proxy for absence deduction
  const hourlyRate = dailyHours>0 ? (emp.weeklySalary||0) / (dailyHours * (workDays.length||6)) : 0;

  const attSnap = await getDocs(query(collection(db,COL_ATT), where("employeeId","==",emp.id), where("date",">=",rangeStartStr), where("date","<=",rangeEndStr)));
  const attByDate = {};
  attSnap.docs.forEach(d=> attByDate[d.data().date] = d.data());

  const dedSnap = await getDocs(query(collection(db,COL_DED), where("employeeId","==",emp.id), where("date",">=",rangeStartStr), where("date","<=",rangeEndStr)));
  const manualEntries = dedSnap.docs.map(d=>d.data());
  const manualDeduction = manualEntries.reduce((s,v)=>s+v.amount,0);

  let autoDeduction = 0, absentDays = 0, lateDays = 0;
  const dayDetails = [];
  let cur = new Date(rangeStartDate);
  while(cur <= effectiveEnd){
    if(workDays.includes(cur.getDay())){
      const rec = attByDate[dateStr(cur)];
      if(!rec || !rec.checkInTime){
        const amt = dailyHours * hourlyRate;
        autoDeduction += amt;
        absentDays++;
        dayDetails.push({ date:dateStr(cur), type:"absent", amount:amt });
      } else {
        const lateMin = rec.lateMinutes||0;
        const earlyMin = rec.earlyMinutes||0;
        const amt = deductionForMinutes(emp.lateTiers, lateMin) + deductionForMinutes(emp.lateTiers, earlyMin);
        if(amt>0) lateDays++;
        autoDeduction += amt;
        if(amt>0) dayDetails.push({ date:dateStr(cur), type:"late", lateMin, earlyMin, amount:amt });
      }
    }
    cur = addDays(cur,1);
  }
  return { autoDeduction, manualDeduction, manualEntries, absentDays, lateDays, dayDetails, weeklySalary: emp.weeklySalary||0 };
}
async function computeWeeklyBreakdown(emp, weekStartDate){
  const b = await computeBreakdownForRange(emp, weekStartDate, addDays(weekStartDate,6));
  const net = (emp.weeklySalary||0) - b.autoDeduction - b.manualDeduction;
  return { ...b, net };
}
function countFridaysInRange(startDate, endDateInclusive){
  let n=0, cur=new Date(startDate);
  while(cur <= endDateInclusive){
    if(cur.getDay()===5) n++; // Friday
    cur = addDays(cur,1);
  }
  return n;
}
async function computeEmployeeBalance(emp){
  const start = emp.payrollStartDate ? new Date(emp.payrollStartDate+"T00:00:00") : new Date();
  const today = new Date(); today.setHours(0,0,0,0);
  const fridayCount = countFridaysInRange(start, today);
  const totalCredited = fridayCount * (emp.weeklySalary||0);
  const breakdown = await computeBreakdownForRange(emp, start, today);
  const paySnap = await getDocs(query(collection(db,COL_PAY), where("employeeId","==",emp.id)));
  const totalPaid = paySnap.docs.reduce((s,d)=> s + (d.data().amount||0), 0);
  const balance = totalCredited - breakdown.autoDeduction - breakdown.manualDeduction - totalPaid;
  return { fridayCount, totalCredited, autoDeduction: breakdown.autoDeduction, manualDeduction: breakdown.manualDeduction, totalPaid, balance };
}

async function savePayment(emp, currentBalance){

    employeeId: emp.id, employeeName: emp.name, amount, type,
    note: note || (type==="partial" ? "تسليم جزئي" : "تسليم كامل"),

async function runStatement(){
  const empSel = $("#stmtEmp").value;
  const periodEl = $all(".chip-check[data-period].on")[0];
  const period = periodEl ? periodEl.dataset.period : "week";
  const today = new Date(); today.setHours(0,0,0,0);
  let rangeStart, rangeEnd;
  if(period==="week"){
    rangeStart = getSaturdayOfCurrentWeek(today);
    rangeEnd = addDays(rangeStart,6);
  } else if(period==="month"){
    rangeStart = new Date(today.getFullYear(), today.getMonth(), 1);
    rangeEnd = new Date(today.getFullYear(), today.getMonth()+1, 0);
  } else {
    const fromVal = $("#stmtFrom").value, toVal = $("#stmtTo").value;
    if(!fromVal || !toVal){ showToast("حدد تاريخ البداية والنهاية"); return; }
    rangeStart = new Date(fromVal+"T00:00:00");
    rangeEnd = new Date(toVal+"T00:00:00");
  }
  const rangeStartStr = dateStr(rangeStart), rangeEndStr = dateStr(rangeEnd);
  const targets = empSel==="all" ? employeesCache.filter(e=>e.active!==false) : employeesCache.filter(e=>e.id===empSel);
  const wrap = $("#statementResult");
  wrap.innerHTML = `<div class="spinner"></div>`;

  let html = "";
  for(const e of targets){
    const b = await computeBreakdownForRange(e, rangeStart, rangeEnd);
    const fridaysInRange = countFridaysInRange(rangeStart, rangeEnd);
    const credited = fridaysInRange * (e.weeklySalary||0);
    const paySnap = await getDocs(query(collection(db,COL_PAY), where("employeeId","==",e.id), where("date",">=",rangeStartStr), where("date","<=",rangeEndStr)));
    const payments = paySnap.docs.map(d=>d.data());
    const paidInRange = payments.reduce((s,v)=>s+v.amount,0);
    const netChange = credited - b.autoDeduction - b.manualDeduction - paidInRange;

    const dayRows = b.dayDetails.map(d=> d.type==="absent"
      ? `<tr><td>${d.date}</td><td>غياب</td><td>${money(d.amount)}</td></tr>`
      : `<tr><td>${d.date}</td><td>${d.lateMin>0?`تأخير ${d.lateMin}د `:""}${d.earlyMin>0?`مبكر ${d.earlyMin}د`:""}</td><td>${money(d.amount)}</td></tr>`
    ).join("");
    const manualRows = b.manualEntries.map(m=>`<tr><td>${m.date}</td><td>${m.reason||"استقطاع يدوي"}</td><td>${money(m.amount)}</td></tr>`).join("");
    const payRows = payments.map(p=>`<tr><td>${p.date}</td><td>${p.note||"تسليم راتب"}</td><td style="color:var(--green);">${money(p.amount)}</td></tr>`).join("");

    html += `<div class="card" style="margin-bottom:10px;">
      <div style="font-weight:800;margin-bottom:8px;">${e.name} <span class="muted" style="font-weight:500;font-size:12px;">(${fmtDateShort(rangeStart)}–${fmtDateShort(rangeEnd)})</span></div>
      <table>
        <tr><th>رواتب مستحقة</th><th>استقطاعات</th><th>مدفوعات</th><th>صافي التغيّر</th></tr>
        <tr><td>${money(credited)}</td><td>${money(b.autoDeduction+b.manualDeduction)}</td><td>${money(paidInRange)}</td><td style="font-weight:800;">${money(netChange)}</td></tr>
      </table>
      ${(dayRows||manualRows||payRows) ? `<div class="stitch"></div><table>${dayRows}${manualRows}${payRows}</table>` : ""}
    </div>`;
  }
  wrap.innerHTML = html || `<div class="empty-state">لا توجد بيانات لهذه الفترة</div>`;
}
